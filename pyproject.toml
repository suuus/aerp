[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aerp"
version = "0.1.0"
description = "Deterministic evidence records that bind intent to execution and outcomes"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Suzanne Daniels" }
]
keywords = [
  "agents",
  "attestations",
  "compliance",
  "evidence",
  "governance",
  "provenance",
  "supply-chain"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/suuus/aerp"
Repository = "https://github.com/suuus/aerp"
Issues = "https://github.com/suuus/aerp/issues"

[project.scripts]
aerp = "aerp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aerp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
